<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="474" viewBox="0 0 1280 474" role="img"><title>固定流程与可回看的查询循环</title><desc>下路从改查班次返回观察节点；到达查询上限时转交用户。上路的汇总或复核已在校验规则中指定。</desc><g font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">
