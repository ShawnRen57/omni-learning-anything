<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img"><title>同一座小屋的平面、正立面和横剖面。</title><rect width="1200" height="480" fill="#fffcf5"/><g font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif"><text x="40" y="55" font-size="44" fill="#183642" font-weight="650" text-anchor="start">同一座小屋，从哪里看才能知道屋顶有多高？</text><path d="M40 79 H1160" stroke="#bac7c5" fill="none" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="40" y="453" font-size="23" fill="#516773" font-weight="450" text-anchor="start">同一所虚构的单间小屋；三图为读图示范，未给实测尺寸。</text><text x="213" y="133" font-size="28" fill="#183642" font-weight="650" text-anchor="middle">平面 · 从上往下看</text><text x="597" y="133" font-size="28" fill="#183642" font-weight="650" text-anchor="middle">立面 · 站在门前看</text><text x="980" y="133" font-size="28" fill="#183642" font-weight="650" text-anchor="middle">剖面 · 沿虚线竖切</text><path d="M190 332 H81 V173 H349 V332 H239" stroke="#183642" fill="none" stroke-width="12" stroke-linejoin="round" stroke-linecap="round"/><path d="M75 231 H354" stroke="#a3452c" fill="none" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="9 7"/><text x="79" y="216" font-size="23" fill="#a3452c" font-weight="650" text-anchor="middle">A</text><text x="350" y="216" font-size="23" fill="#a3452c" font-weight="650" text-anchor="middle">A</text><path d="M215,358 L215,301" stroke="#006f70" fill="none" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><path d="M221.11813654622506,312.47032716193155 L215,301 L208.88186345377494,312.47032716193155" stroke="#006f70" fill="none" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><text x="214" y="390" font-size="26" fill="#006f70" font-weight="650" text-anchor="middle">门的位置与进入路线</text><path d="M474 327 V240 L596 166 L718 240 V327 Z" stroke="#183642" fill="#eee4d2" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M465 241 L596 15