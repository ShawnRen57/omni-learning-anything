<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img"><title>用开口与支撑对照三类建筑。</title><rect width="1200" height="480" fill="#fffcf5"/><g font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif"><text x="40" y="55" font-size="44" fill="#183642" font-weight="650" text-anchor="start">用同一个问题，读三种跨越空间的形状</text><path d="M40 79 H1160" stroke="#bac7c5" fill="none" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="40" y="453" font-size="23" fill="#516773" font-weight="450" text-anchor="start">先找到开口，再沿轮廓追到支撑处；最后查原址材料，核对建造年代与用途。</text><text x="215" y="135" font-size="32" fill="#183642" font-weight="650" text-anchor="middle">古希腊神庙</text><text x="600" y="135" font-size="32" fill="#183642" font-weight="650" text-anchor="middle">古罗马剧场</text><text x="985" y="135" font-size="32" fill="#183642" font-weight="650" text-anchor="middle">哥特式教堂</text><path d="M50 342 h330" stroke="#bac7c5" fill="none" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M430 342 h330" stroke="#bac7c5" fill="none" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M812 342 h330" stroke="#bac7c5" fill="none" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><rect x="102" y="223" width="38" height="115" rx="0" fill="#e2f2ef" stroke="#183642" stroke-width="3"/><rect x="281" y="223" width="38" height="115" rx="0" fill="#e2f2ef" stroke="#183642" stroke-width="3"/><rect x="92" y="199" width="238" height="29" rx="0" fill="#e2f2ef" stroke="#183642" stroke-width="3"/><path d="M95 197 L210 153 L327 197 Z" stroke="#183642" fill="#fff1e1" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M487 338 V272 A109 109 0 0 1 705 272 V338 H670 V272 A74 74 0 0 0 522 272 V338 Z" stroke="#183642" fill="#e2f2ef" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M880 338 V272 Q885 198 985 152 Q1085 198 1090 272 V338 H1057 V273 Q1050 218 985 187 Q920 218 913 273 V338 Z" stroke="#183642" fill="#e2f2ef" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><text x="211" y="397" font-size="27" fill="#006f70" font-weight="650" text-anchor="middle">水平梁跨在柱间</text><text x="596" y="397" font-size="27" fill="#006f70" font-weight="650" text-anchor="middle">圆拱覆盖通道</text><text x="985" y="397" font-size="27" fill="#006f70" font-weight="650" text-anchor="middle">尖拱界定高处空间</text></g></svg>
