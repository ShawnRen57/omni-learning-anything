<text x="39" y="55" font-size="38" font-weight="700" text-anchor="start" fill="#19374a">一次承重演示，只覆盖哪一格？</text>
<text x="1240" y="52" font-size="22" font-weight="500" text-anchor="end" fill="#516672">桥梁模型 · 假设实验</text>
