<text x="49" y="230" font-size="31" font-weight="650" text-anchor="start" fill="#19374a">干燥</text>
<text x="49" y="327" font-size="31" font-weight="650" text-anchor="start" fill="#19374a">受潮</text>
<rect x="257" y="179" width="279" height="76" rx="7" fill="#f1f5f6" stroke="#a7bbb9" stroke-width="2"/>
<text x="396" y="227" font-size="29" font-weight="450" text-anchor="middle" fill="#516672">未测</text>
