<text x="1000" y="322" font-size="29" font-weight="450" text-anchor="middle" fill="#516672">未测</text>
<text x="50" y="410" font-size="26" font-weight="550" text-anchor="start" fill="#076b68">横向改变载荷；纵向改变材料状态。</text>
