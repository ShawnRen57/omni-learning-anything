<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="474" viewBox="0 0 1280 474" role="img"><title>用条件矩阵检查演示的证据范围</title><desc>唯一标记「本次承住」的是干燥条件的 200 g 格。整行受潮条件均未测，即使同为 200 g，也缺少对应证据。</desc><g font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">
