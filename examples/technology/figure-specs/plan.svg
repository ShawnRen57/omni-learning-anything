<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="474" viewBox="0 0 1280 474" role="img"><title>把前三课的观察方法带到科技判断卡</title><desc>第三条支线以照明耗电练习定量比较，结业卡需要同时写出数值、单位和假设。</desc><g font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">
<rect x="0" y="0" width="1280" height="474" rx="0" fill="#fcfcf8" stroke="none" stroke-width="0"/>
<text x="39" y="55" font-size="38" font-weight="700" text-anchor="start" fill="#19374a">从手机、桥梁、照明，到一张科技判断卡</text>
<text x="1240" y="52" font-size="22" font-weight="500" text-anchor="end" fill="#516672">科技通识 · 课程路线</text>
<path d="M39 77H1240" stroke="#a7bbb9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<circle cx="56" cy="140" r="10" fill="#076b68" stroke="none" stroke-width="0"/>
<text x="81" y="149" font-size="27" font-weight="650" text-anchor="start" fill="#076b68">第 1 天　拆系统</text>
<text x="349" y="149" font-size="26" font-weight="500" text-anchor="start" fill="#19374a">扫码在哪一环停住？</text>
<path d="M654 140h64" stroke="#a7bbb9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<circle cx="56" cy="231" r="10" fill="#076b68" stroke="none" stroke-width="0"/>
<text x="81" y="240" font-size="27" font-weight="650" text-anchor="start" fill="#076b68">第 2 天　定证据</text>
<text x="349" y="240" font-size="26" font-weight="500" text-anchor="start" fill="#19374a">桥梁在哪种条件下测过？</text>
<path d="M654 231h64" stroke="#a7bbb9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<circle cx="56" cy="322" r="10" fill="#076b68" stroke="none" stroke-width="0"/>
<text x="81" y="331" font-size="27" font-weight="650" text-anchor="start" fill="#076b68">第 3 天　算数量</text>
<text x="349" y="331" font-size="26" font-weight="500" text-anchor="start" fill="#19374a">同样照明用了多少电？</text>
<path d="M654 322h64" stroke="#a7bbb9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<path d="M718 140V322" stroke="#076b68" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<path d="M718 231 L796 231" stroke="#076b68" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<path d="M796 231 L783.00 224.00 L783.00 238.00 Z" stroke="#076b68" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" fill="#076b68"/>
<rect x="808" y="116" width="429" height="247" rx="10" fill="#e6f2ef" stroke="#076b68" stroke-width="2"/>
<text x="836" y="161" font-size="30" font-weight="700" text-anchor="start" fill="#076b68">第 30 天　科技判断卡</text>
<text x="836" y="218" font-size="26" font-weight="500" text-anchor="start" fill="#19374a">对象与系统边界</text>
<text x="836" y="268" font-size="26" font-weight="500" text-anchor="start" fill="#19374a">已测条件与适用范围</text>
<text x="836" y="318" font-size="26" font-weight="500" text-anchor="start" fill="#19374a">数值、单位与假设</text>
<text x="40" y="455" font-size="22" font-weight="500" text-anchor="start" fill="#516672">第 4–29 天在材料、数字技术、AI、生命科学、能源及社会应用中练习这些问题。</text></g></svg>
